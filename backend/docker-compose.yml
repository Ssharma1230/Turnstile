services:
  postgres:
    image: postgres:15
    container_name: turnstile-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: turnstile
    ports:
      - "5432:5432"
    volumes:
      - turnstile_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  turnstile_data: